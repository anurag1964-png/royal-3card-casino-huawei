name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Export Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
        
      - name: Build TWA Package Directly
        run: |
          # Create a proper manifest with absolute safe parameters
          cat << 'EOF' > t-manifest.json
          {
            "packageId": "com.playzone.royalcasino.hw",
            "host": "anurag1964-png.github.io",
            "name": "Royal 3-Card Casino",
            "shortName": "RoyalCasino",
            "startUrl": "/royal-3card-casino-huawei/",
            "display": "standalone",
            "themeColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "shortcuts": [],
            "iconUrl": "https://raw.githubusercontent.com/w3c/manifest/master/tests/icon.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/w3c/manifest/master/tests/icon.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "minSdkVersion": 21,
            "generatorApp": "bubblewrap-cli",
            "useBrowserFallback": false,
            "alphaCodename": ""
          }
          EOF

          # Generate keystore
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android, O=Playzone, C=IN"

          # Run bubblewrap update/build non-interactively
          bubblewrap update --manifest=t-manifest.json --skip-icon-validation || true
          bubblewrap build --manifest=t-manifest.json --skip-signing || true
        shell: bash

      - name: Search and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-casino-apk
          path: |
            *.apk
            app/build/outputs/apk/release/*.apk
            app-release-signed.apk
            app/build/outputs/apk/debug/*.apk
