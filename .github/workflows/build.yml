name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
        
      - name: Generate Icon and Manifest
        run: |
          # 1. Download a valid test icon
          curl -o icon.png https://raw.githubusercontent.com/w3c/manifest/master/tests/icon.png
          
          # 2. Create manifest for Huawei package
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.playzone.royalcasino.hw",
            "host": "anurag1964-png.github.io",
            "name": "Royal 3-Card Casino",
            "shortName": "RoyalCasino",
            "startUrl": "/royal-3card-casino-huawei/",
            "display": "standalone",
            "themeColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "shortcuts": [],
            "iconUrl": "icon.png",
            "maskableIconUrl": "icon.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "minSdkVersion": 21,
            "generatorApp": "bubblewrap-cli",
            "useBrowserFallback": false,
            "alphaCodename": ""
          }
          EOF

      - name: Initialize TWA and Build APK
        run: |
          # 3. Initialize project in a separate folder non-interactively
          bubblewrap init --manifest=twa-manifest.json --directory=twa-app --force
          
          # 4. Move into the project directory
          cd twa-app
          
          # 5. Generate keystore inside the project
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android, O=Playzone, C=IN"
          
          # 6. Build the signed APK
          bubblewrap build --directory=.

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royal-casino-apk
          path: twa-app/app-release-signed.apk
