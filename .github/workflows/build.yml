name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
        
      - name: Create Local Manifest and Build APK
        run: |
          set -e
          
          # 1. Download valid test icon
          curl -L -o icon.png https://raw.githubusercontent.com/w3c/manifest/master/tests/icon.png
          
          # 2. Create local web manifest.json for PWA compliance
          cat << 'EOF' > manifest.json
          {
            "name": "Royal 3-Card Casino",
            "short_name": "RoyalCasino",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#000000",
            "icons": [
              {
                "src": "icon.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF

          # 3. Create TWA Manifest for Huawei package
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.playzone.royalcasino.hw",
            "host": "anurag1964-png.github.io",
            "name": "Royal 3-Card Casino",
            "shortName": "RoyalCasino",
            "startUrl": "/royal-3card-casino-huawei/",
            "display": "standalone",
            "themeColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "shortcuts": [],
            "iconUrl": "icon.png",
            "maskableIconUrl": "icon.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "minSdkVersion": 21,
            "generatorApp": "bubblewrap-cli",
            "useBrowserFallback": false,
            "alphaCodename": ""
          }
          EOF
          
          # 4. Generate Keystore
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android, O=Playzone, C=IN"
          
          # 5. Initialize and Build APK
          yes | bubblewrap init --manifest=twa-manifest.json || true
          bubblewrap build --manifest=twa-manifest.json || true
        shell: bash

      - name: Search and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royal-casino-apk
          path: |
            app-release-signed.apk
            app/build/outputs/apk/release/*.apk
            *.apk
