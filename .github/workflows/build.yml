name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Configure Environment Paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/tools" >> $GITHUB_PATH

      - name: Create Manifest and Build APK
        run: |
          set -e
          
          # 1. Download valid test icon
          curl -L -o icon.png https://raw.githubusercontent.com/w3c/manifest/master/tests/icon.png
          
          # 2. Create official TWA Manifest for Huawei package
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.playzone.royalcasino.hw",
            "host": "anurag1964-png.github.io",
            "name": "Royal 3-Card Casino",
            "shortName": "RoyalCasino",
            "startUrl": "/royal-3card-casino-huawei/",
            "display": "standalone",
            "themeColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "shortcuts": [],
            "iconUrl": "icon.png",
            "maskableIconUrl": "icon.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "minSdkVersion": 21,
            "generatorApp": "bubblewrap-cli",
            "useBrowserFallback": false,
            "alphaCodename": ""
          }
          EOF
          
          # 3. Generate Keystore
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android, O=Playzone, C=IN"
          
          # 4. Initialize Bubblewrap project non-interactively in a dedicated folder
          npx @bubblewrap/cli init --manifest=twa-manifest.json --directory=app-output --force
          
          # 5. Build the signed APK inside the folder
          cd app-output
          npx @bubblewrap/cli build
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royal-casino-apk
          path: |
            app-output/app-release-signed.apk
            app-output/app/build/outputs/apk/release/*.apk
            *.apk
